services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget_tailwind_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "7000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: budgeting_system
      DB_USERNAME: budget_user
      DB_PASSWORD: budget_pass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: budget_tailwind_db
    restart: unless-stopped
    ports:
      - "3311:3306"
    environment:
      MYSQL_DATABASE: budgeting_system
      MYSQL_USER: budget_user
      MYSQL_PASSWORD: budget_pass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: budget_tailwind_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root

volumes:
  mysql_data:
